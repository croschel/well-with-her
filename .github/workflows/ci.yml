name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test + coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build
        env:
          # `next build` prerenders pages against real content
          # (Home/Category/Article/sitemap.ts all fetch from Payload during
          # static generation) — it never writes. Even so, CI_DATABASE_URI
          # must point at the `development` Neon branch, never `production`:
          # a schema drift or bad row here should never be able to touch
          # what the live site serves. See docs/vercel-deploy-checklist.md.
          DATABASE_URI: ${{ secrets.CI_DATABASE_URI }}
          PAYLOAD_SECRET: ${{ secrets.CI_PAYLOAD_SECRET }}

# ── Future: deploy job goes here. Out of scope for this plan. ──
